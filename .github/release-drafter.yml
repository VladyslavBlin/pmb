# Release Drafter config — auto-builds the next release's notes
# from merged PRs since the last tag.
#
# How it works:
#   1. On every PR merge to main, the release-drafter workflow runs.
#   2. It maintains a single DRAFT GitHub Release (you don't see it
#      publicly until you click Publish).
#   3. PRs are categorized by their labels (see "categories" below).
#   4. When you cut a tag like v0.2.0, you go to Releases → Draft and
#      one click → Publish. Notes are already written.
#
# To make this work, add labels to PRs when merging:
#   - feature / enhancement → "🚀 Features"
#   - fix / bug             → "🐛 Bug Fixes"
#   - chore / refactor      → "🧰 Maintenance"
#   - docs                  → "📝 Documentation"
#   - dependencies          → "⬆️  Dependencies"
#   - breaking              → "💥 Breaking Changes"
# PRs with no matching label still appear in "Other changes".

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# Auto-bump semver from PR labels:
#   - "breaking" label → major
#   - "feature" / "enhancement" → minor
#   - everything else → patch
version-resolver:
  major:
    labels:
      - "breaking"
      - "major"
  minor:
    labels:
      - "feature"
      - "enhancement"
      - "minor"
  patch:
    labels:
      - "fix"
      - "bug"
      - "patch"
      - "chore"
      - "docs"
      - "dependencies"
  default: patch

categories:
  - title: "💥 Breaking Changes"
    labels:
      - "breaking"
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bug"
  - title: "📝 Documentation"
    labels:
      - "docs"
      - "documentation"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "refactor"
      - "test"
  - title: "⬆️ Dependencies"
    collapse-after: 5  # collapse if more than 5 dep PRs in one release
    labels:
      - "dependencies"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&' # escape markdown specials in PR titles

# Exclude noise from the changelog (still appears in raw PR list, just
# not in release notes).
exclude-labels:
  - "skip-changelog"
  - "ignore-for-release"

# Auto-label by file paths / PR title patterns. Reduces manual labeling
# burden — eg. any docs/* change auto-gets the "docs" label.
autolabeler:
  - label: "docs"
    files:
      - "docs/**"
      - "*.md"
    title:
      - "/^docs[:(]/i"
  - label: "ci"
    files:
      - ".github/**"
      - ".pre-commit-config.yaml"
    title:
      - "/^ci[:(]/i"
  - label: "chore"
    title:
      - "/^chore[:(]/i"
      - "/^refactor[:(]/i"
  - label: "fix"
    title:
      - "/^fix[:(]/i"
      - "/^bugfix[:(]/i"
  - label: "feature"
    title:
      - "/^feat[:(]/i"
      - "/^feature[:(]/i"
  - label: "breaking"
    title:
      - "/!:/" # conventional-commits style "feat!: ..."

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ---
  *Release notes auto-generated by [release-drafter](https://github.com/release-drafter/release-drafter).*
